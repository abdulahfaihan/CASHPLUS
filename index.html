<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>تخفيضات القيصومة</title>
  <meta name="description" content="تخفيضات القيصومة – عروض يومية وخدمة سريعة" />

  <style>
    :root{
      --bg:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --wa:#22c55e;
      --call:#2563eb;
      --map:#0ea5e9;
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    /* ====== HEADER ====== */
    header{
      padding:12px 16px 6px;
      text-align:center;
    }
    header h1{
      margin:0;
      font-size:18px;
      font-weight:800;
    }
    header p{
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
    }

    /* ====== SLIDER ====== */
    .slider{
      position:relative;
      margin:12px 16px;
      border-radius:var(--radius);
      overflow:hidden;
      height:240px;
    }
    .slides{
      display:flex;
      width:300%;
      height:100%;
      animation: slide 12s infinite;
    }
    .slide{
      width:100%;
      flex-shrink:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:700;
      color:#fff;
    }
    .s1{background:linear-gradient(135deg,#2563eb,#22c55e)}
    .s2{background:linear-gradient(135deg,#f97316,#ef4444)}
    .s3{background:linear-gradient(135deg,#0ea5e9,#6366f1)}

    @keyframes slide{
      0%{transform:translateX(0)}
      30%{transform:translateX(0)}
      35%{transform:translateX(-100%)}
      65%{transform:translateX(-100%)}
      70%{transform:translateX(-200%)}
      95%{transform:translateX(-200%)}
      100%{transform:translateX(0)}
    }

    /* ====== CTA BUTTONS ====== */
    .actions{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
      padding:12px 16px;
    }
    .btn{
      text-decoration:none;
      padding:14px 10px;
      border-radius:14px;
      font-weight:800;
      font-size:14px;
      text-align:center;
      color:#fff;
    }
    .wa{background:var(--wa)}
    .call{background:var(--call)}
    .map{background:var(--map)}

    /* ====== INFO ====== */
    .info{
      padding:8px 16px 20px;
      font-size:13px;
      color:var(--muted);
      line-height:1.7;
      text-align:center;
    }

    /* ====== DESKTOP LIMIT ====== */
    @media (min-width:768px){
      body{max-width:420px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
    }
  </style>
</head>

<body>

  <header>
    <h1>تخفيضات القيصومة</h1>
    <p>عروض يومية • خدمة سريعة • القيصومة</p>
  </header>

  <!-- SLIDER -->
  <section class="slider">
    <div class="slides">
      <div class="slide s1">عروض يومية</div>
      <div class="slide s2">أسعار مخفضة</div>
      <div class="slide s3">خدمة سريعة</div>
    </div>
  </section>

  <!-- ACTION BUTTONS -->
  <section class="actions">
    <a class="btn wa" href="https://wa.me/966500000000" target="_blank">واتساب</a>
    <a class="btn call" href="tel:0500000000">اتصال</a>
    <a class="btn map" href="https://maps.google.com/?q=Al%20Qaysumah" target="_blank">الموقع</a>
  </section>

  <!-- INFO -->
  <section class="info">
    مفتوح يوميًا من 8 صباحًا حتى 12 منتصف الليل  
    <br>
    📍 الحي الرئيسي – القيصومة
  </section>

</body>
</html>
